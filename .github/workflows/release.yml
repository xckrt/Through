name: release

# тег v1.2.3 → тесты → программа → (подпись) → переносная версия и установщик → (подпись) → релиз на GitHub.
# Окно Тропы находит релиз по тегу и сверяет SHA-256 установщика со страницы релиза.
# Подпись SignPath включается сама, когда в секретах репозитория есть SIGNPATH_API_TOKEN (см. docs/signing.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG || 'Tropa' }}
      SIGNPATH_POLICY: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Версия из тега
        id: v
        shell: pwsh
        run: '"version=$("${{ github.ref_name }}".TrimStart("v"))" >> $env:GITHUB_OUTPUT'

      - name: Тесты
        run: dotnet run --project tests/Tropa.SelfTest -c Release

      - name: Программа
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ steps.v.outputs.version }} -Step stage

      # ---- подпись программы: Tropa.exe, Tropa.Service.exe и сборки Тропы (конфигурация app в SignPath)
      - name: Неподписанная программа
        id: app
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: artifacts/stage/

      - name: Подпись программы
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/stage

      - name: Переносная версия и установщик
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ steps.v.outputs.version }} -Step package

      # ---- подпись установщика (конфигурация setup), после неё хеш считается заново
      - name: Неподписанный установщик
        id: setup
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: setup-unsigned
          path: artifacts/Tropa-Setup-${{ steps.v.outputs.version }}.exe

      - name: Подпись установщика
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORG }}
          project-slug: ${{ env.SIGNPATH_PROJECT }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts

      - name: Хеши
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          foreach ($f in "Tropa-Setup-$v.exe", "Tropa-Portable-$v.zip") {
            $h = (Get-FileHash "artifacts/$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $f" | Set-Content -Encoding ascii "artifacts/$f.sha256"
          }
          $sig = (Get-AuthenticodeSignature "artifacts/Tropa-Setup-$v.exe").Status
          "подпись установщика: $sig"

      - name: Манифесты winget и Scoop
        shell: pwsh
        run: ./build/packages.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $sha = (Get-Content "artifacts/Tropa-Setup-$v.exe.sha256").Split(" ")[0]
          $psha = (Get-Content "artifacts/Tropa-Portable-$v.zip.sha256").Split(" ")[0]
          $signed = (Get-AuthenticodeSignature "artifacts/Tropa-Setup-$v.exe").Status -eq "Valid"
          $signNote = "Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org)."
          $notes = @"
          ## Установка

          Скачайте **Tropa-Setup-$v.exe** и запустите. Windows один раз спросит разрешение администратора:
          Тропа ставит службу, которая держит обход после перезагрузки. Дальше откройте Тропу и нажмите
          «Подобрать обход».

          Уже стоит Тропа — она сама предложит обновиться.

          Без установки: **Tropa-Portable-$v.zip** — распакуйте и запустите Tropa.exe. Обход работает,
          пока открыта Тропа; данные лежат в папке data рядом.

          SHA-256 установщика: ``$sha``
          SHA-256 переносной версии: ``$psha``
          $signNote

          Тропа скачивает zapret из официальных релизов [bol-van/zapret](https://github.com/bol-van/zapret)
          и сверяет хеши; бинарей zapret в этом репозитории нет.
          "@
          gh release create "${{ github.ref_name }}" "artifacts/Tropa-Setup-$v.exe" "artifacts/Tropa-Setup-$v.exe.sha256" `
            "artifacts/Tropa-Portable-$v.zip" "artifacts/Tropa-Portable-$v.zip.sha256" `
            --title "Тропа $v" --notes $notes

      # Scoop: бакет лежит в этом репозитории, после релиза в нём новая версия и хеш
      - name: Scoop-бакет
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B bucket-update origin/main
          ./build/packages.ps1 -Version ${{ steps.v.outputs.version }} | Out-Null
          git add bucket/tropa.json
          git diff --cached --quiet || (git commit -m "Scoop: Тропа ${{ steps.v.outputs.version }}" && git push origin HEAD:main)

      # winget: PR в microsoft/winget-pkgs от имени владельца токена (секрет WINGET_TOKEN, classic PAT с public_repo)
      - name: winget
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN "artifacts/winget/${{ steps.v.outputs.version }}"
