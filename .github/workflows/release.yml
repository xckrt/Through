name: release

# тег v1.2.3 → тесты → программа → переносная версия и установщик → релиз на GitHub.
# Окно Сквозь находит релиз по тегу и сверяет SHA-256 установщика со страницы релиза.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Версия из тега
        id: v
        shell: pwsh
        run: '"version=$("${{ github.ref_name }}".TrimStart("v"))" >> $env:GITHUB_OUTPUT'

      - name: Тесты
        run: dotnet run --project tests/Through.SelfTest -c Release

      - name: Программа
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ steps.v.outputs.version }} -Step stage

      - name: Переносная версия и установщик
        shell: pwsh
        run: ./build/publish.ps1 -Version ${{ steps.v.outputs.version }} -Step package

      - name: Хеши
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          foreach ($f in "Through-Setup-$v.exe", "Through-Portable-$v.zip") {
            $h = (Get-FileHash "artifacts/$f" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  $f" | Set-Content -Encoding ascii "artifacts/$f.sha256"
          }

      - name: Манифесты winget и Scoop
        shell: pwsh
        run: ./build/packages.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Релиз
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $sha = (Get-Content "artifacts/Through-Setup-$v.exe.sha256").Split(" ")[0]
          $psha = (Get-Content "artifacts/Through-Portable-$v.zip.sha256").Split(" ")[0]
          $notes = @"
          ## Установка

          Скачайте **Through-Setup-$v.exe** и запустите. Windows один раз спросит разрешение администратора:
          Сквозь ставит службу, которая держит обход после перезагрузки. Дальше откройте Сквозь и нажмите
          «Подобрать обход».

          Уже стоит Сквозь — она сама предложит обновиться.

          Без установки: **Through-Portable-$v.zip** — распакуйте и запустите Through.exe. Обход работает,
          пока открыта Сквозь; данные лежат в папке data рядом.

          SHA-256 установщика: ``$sha``
          SHA-256 переносной версии: ``$psha``

          Сквозь скачивает zapret из официальных релизов [bol-van/zapret](https://github.com/bol-van/zapret)
          и сверяет хеши; бинарей zapret в этом репозитории нет.
          "@
          gh release create "${{ github.ref_name }}" "artifacts/Through-Setup-$v.exe" "artifacts/Through-Setup-$v.exe.sha256" `
            "artifacts/Through-Portable-$v.zip" "artifacts/Through-Portable-$v.zip.sha256" `
            --title "Сквозь $v" --notes $notes

      # Мост для старых установок «Тропа»: их апдейтер ищет Tropa-Setup-<v>.exe на странице релиза.
      # Кладём тот же установщик под старым именем, чтобы они обновились и мигрировали на Through.
      # Установщик делает миграцию сам. Этот шаг можно убрать через пару версий, когда почти все обновятся.
      - name: Совместимость со старым именем (Тропа → Through)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.version }}"
          Copy-Item "artifacts/Through-Setup-$v.exe" "artifacts/Tropa-Setup-$v.exe"
          $h = (Get-FileHash "artifacts/Tropa-Setup-$v.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  Tropa-Setup-$v.exe" | Set-Content -Encoding ascii "artifacts/Tropa-Setup-$v.exe.sha256"
          gh release upload "${{ github.ref_name }}" "artifacts/Tropa-Setup-$v.exe" "artifacts/Tropa-Setup-$v.exe.sha256"

      # Scoop: бакет лежит в этом репозитории, после релиза в нём новая версия и хеш
      - name: Scoop-бакет
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B bucket-update origin/main
          ./build/packages.ps1 -Version ${{ steps.v.outputs.version }} | Out-Null
          git add bucket/through.json
          git diff --cached --quiet || (git commit -m "Scoop: Сквозь ${{ steps.v.outputs.version }}" && git push origin HEAD:main)

      # winget: PR в microsoft/winget-pkgs от имени владельца токена (секрет WINGET_TOKEN, classic PAT с public_repo)
      - name: winget
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN "artifacts/winget/${{ steps.v.outputs.version }}"

  # Сквозь для Android: собирается всегда (проверка), к релизу прикладывается только с постоянным ключом
  # (секреты ANDROID_KEYSTORE — base64 от .jks, ANDROID_KEY_ALIAS, ANDROID_KEY_PASS; см. docs/android.md).
  # С отладочной подписью новая версия не встала бы поверх старой.
  android:
    needs: release
    runs-on: windows-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Workload android
        run: dotnet workload install android

      - name: APK
        shell: pwsh
        env:
          TROPA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TROPA_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          if ($env:ANDROID_KEYSTORE) {
            $ks = Join-Path $env:RUNNER_TEMP "through.jks"
            [IO.File]::WriteAllBytes($ks, [Convert]::FromBase64String($env:ANDROID_KEYSTORE))
            $env:TROPA_KEYSTORE = $ks
          }
          dotnet publish src/Through.Android -c Release -p:Version=$v -o artifacts/android
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item artifacts/android/com.xckrt.through-Signed.apk "artifacts/Through-Android-$v.apk"
          $h = (Get-FileHash "artifacts/Through-Android-$v.apk" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$h  Through-Android-$v.apk" | Set-Content -Encoding ascii "artifacts/Through-Android-$v.apk.sha256"

      - name: APK в релиз
        if: env.ANDROID_KEYSTORE != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          gh release upload "${{ github.ref_name }}" "artifacts/Through-Android-$v.apk" "artifacts/Through-Android-$v.apk.sha256"
